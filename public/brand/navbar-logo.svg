<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Crisp White & Studio Silver Gradients -->
    <linearGradient id="emblemSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D0D4DC"/>
    </linearGradient>

    <!-- Studio Crimson Red Gradient -->
    <linearGradient id="emblemRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF383E"/>
      <stop offset="100%" stop-color="#E31E24"/>
    </linearGradient>

    <!-- Crimson Glow for Audio Frequency Bars -->
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ================= EMBLEM ICON (Left) ================= -->
  <g transform="translate(4, 4)">
    <!-- Outer Precision Ring with 4 Sector Cuts -->
    <!-- Top-Left Arc -->
    <path d="M 28 6 A 22 22 0 0 0 7 26" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95" />
    <!-- Bottom-Left Arc -->
    <path d="M 7 30 A 22 22 0 0 0 24 49.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95" />
    <!-- Bottom Base Curve -->
    <path d="M 23 52.5 A 25 25 0 0 0 33 52.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9" />
    <!-- Bottom-Right Arc -->
    <path d="M 32 49.5 A 22 22 0 0 0 49 30" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95" />
    <!-- Top-Right Arc -->
    <path d="M 49 26 A 22 22 0 0 0 28 6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95" />

    <!-- Red Corner Accents on the Circle -->
    <path d="M 12 18 A 22 22 0 0 0 9 24" stroke="#FF2E36" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#waveGlow)" />
    <path d="M 47 24 A 22 22 0 0 0 44 18" stroke="#FF2E36" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#waveGlow)" />
    <path d="M 9 32 A 22 22 0 0 0 13 39" stroke="#FF2E36" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#waveGlow)" />
    <path d="M 43 39 A 22 22 0 0 0 47 32" stroke="#FF2E36" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#waveGlow)" />

    <!-- Symmetric Audio Waveform Frequency Spikes (Vivid Studio Red) -->
    <g stroke="url(#emblemRed)" stroke-width="2" stroke-linecap="round" filter="url(#waveGlow)">
      <!-- Left side audio spikes -->
      <line x1="2" y1="28" x2="2" y2="28" stroke-width="2.2" />
      <line x1="5" y1="26" x2="5" y2="30" />
      <line x1="8" y1="23" x2="8" y2="33" />
      <line x1="11" y1="21" x2="11" y2="35" stroke-width="2.2" />
      <line x1="14" y1="18" x2="14" y2="38" stroke-width="2.4" />
      <line x1="17" y1="22" x2="17" y2="34" />
      <line x1="20" y1="25" x2="20" y2="31" />
      <line x1="23" y1="26.5" x2="23" y2="29.5" />

      <!-- Right side audio spikes -->
      <line x1="33" y1="26.5" x2="33" y2="29.5" />
      <line x1="36" y1="25" x2="36" y2="31" />
      <line x1="39" y1="22" x2="39" y2="34" />
      <line x1="42" y1="18" x2="42" y2="38" stroke-width="2.4" />
      <line x1="45" y1="21" x2="45" y2="35" stroke-width="2.2" />
      <line x1="48" y1="23" x2="48" y2="33" />
      <line x1="51" y1="26" x2="51" y2="30" />
      <line x1="54" y1="28" x2="54" y2="28" stroke-width="2.2" />
    </g>

    <!-- Center Vertical Microphone / Sound Fader Shaft -->
    <!-- Vertical stem -->
    <line x1="28" y1="14" x2="28" y2="47" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
    <!-- Top Capsule Head -->
    <ellipse cx="28" cy="11.5" rx="5.5" ry="5.5" fill="#FFFFFF" />
    <!-- Center Node Ring -->
    <circle cx="28" cy="28" r="4.2" fill="#0B0B0E" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="28" cy="28" r="1.6" fill="#FF2E36" filter="url(#waveGlow)" />
  </g>

  <!-- ================= BRAND TYPOGRAPHY (Right) ================= -->
  <g transform="translate(74, 38)">
    <!-- "AIR " in Sleek White -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="0.08em" fill="#FFFFFF">
      AIR
    </text>

    <!-- "MIX" in Studio Crimson Red -->
    <text x="68" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="0.08em" fill="url(#emblemRed)" filter="url(#waveGlow)">
      MIX
    </text>

    <!-- Subtitle: "AUDIO ENGINEER" tracked out -->
    <text x="1.5" y="15" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.8" letter-spacing="0.32em" fill="#B5BAC6">
      AUDIO ENGINEER
    </text>
  </g>
</svg>
